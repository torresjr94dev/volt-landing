<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>VOLT og image</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Urbanist:wght@500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #09090F; }
    .card {
      position: relative; width: 1200px; height: 630px; overflow: hidden;
      background: #09090F; color: #EDEDEF;
      font-family: "Urbanist", system-ui, sans-serif;
      border: 1px solid #33333B; box-sizing: border-box;
    }
    .bolt { position: absolute; right: 40px; top: -70px; height: 780px; color: #C2FC4A; }
    .copy { position: absolute; left: 72px; top: 64px; width: 720px; }
    h1 {
      margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
      font-size: 118px; line-height: 0.92; letter-spacing: -0.03em; text-transform: uppercase;
    }
    p { margin: 26px 0 0; font-size: 25px; line-height: 1.35; color: #8A8F98; max-width: 600px; }
    .brand {
      position: absolute; left: 72px; bottom: 56px; display: flex; align-items: center; gap: 16px;
      font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 34px;
    }
    .pill {
      position: absolute; right: 72px; bottom: 56px;
      background: #C2FC4A; color: #09090F; font-weight: 700; font-size: 26px;
      padding: 18px 34px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="bolt" viewBox="36 22 38 64"><path d="M61 22 36 60h16l-5 26 27-40H57z" fill="currentColor"/></svg>
    <div class="copy">
      <h1>Tu música,<br>a todo<br>voltaje.</h1>
      <p>Reproductor para Android con todo YouTube Music. Segundo plano, letra sincronizada y un rayo para compartir.</p>
    </div>
    <div class="brand">
      <svg viewBox="14 14 80 80" width="48" height="48"><rect x="14" y="14" width="80" height="80" rx="20" fill="#C2FC4A"/><path d="M61 22 36 60h16l-5 26 27-40H57z" fill="#09090F"/></svg>
      VOLT
    </div>
    <div class="pill">Descargar APK</div>
  </div>
</body>
</html>
